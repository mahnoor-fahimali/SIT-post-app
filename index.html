<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIT Post App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SIT Post App</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">

            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4">

                        <h4 class="card-title fw-bold mb-4">Create a Post</h4>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Post Title</label>
                            <input type="text" class="form-control form-control-lg" id="title"
                                placeholder="Enter post title">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" rows="5" id="description"
                                placeholder="Write something..."></textarea>
                        </div>

                        <button class="btn btn-dark px-4" onclick="post()">
                            Publish Post
                        </button>

                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-4">Your Posts</h4>
                        <div id="postcontainer">
                            <p class="text-muted text-center">No posts yet. Create your first post!</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>

</body>

</html>
